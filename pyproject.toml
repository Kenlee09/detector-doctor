[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "detector-doctor"
version = "0.1.0"
description = "A controlled agent that diagnoses object-detector robustness and proposes evidence-backed fixes."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Li Yukun", email = "Kenleen09@outlook.com" }]
keywords = ["object-detection", "robustness", "agent", "benchmark", "mlops"]
dependencies = []

[project.optional-dependencies]
llm = ["openai>=1.30"]
dev = ["pytest>=8"]

[project.scripts]
dd = "dd.cli:main"

[project.urls]
Homepage = "https://github.com/Kenlee09/detector-doctor"
Repository = "https://github.com/Kenlee09/detector-doctor"
Issues = "https://github.com/Kenlee09/detector-doctor/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
